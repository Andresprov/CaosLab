[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caoslab"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "docker>=7.0",
]

[project.scripts]
caoslab = "caoslab.cli:main"

[tool.setuptools]
packages = ["caoslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: necesita Docker levantado y la app demo corriendo",
]
