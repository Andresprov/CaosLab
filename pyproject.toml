[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caoslab"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "docker>=7.0",
]

[project.scripts]
caoslab = "caoslab.cli:main"

[tool.setuptools]
packages = ["caoslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: necesita Docker levantado y la app demo corriendo",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert es la forma normal de comprobar en pytest; S101 solo tiene sentido en código de producción
"tests/**" = ["S101"]
